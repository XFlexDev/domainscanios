name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Valitaan $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Fix Format
        run: |
          xcodegen generate
          # Pakotetaan tiedostomuoto yhteensopivaksi kaikkien Xcode-versioiden kanssa
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 60;/g' DomainScanner.xcodeproj/project.pbxproj

      - name: Build App (.app)
        run: |
          xcodebuild clean build \
            -project DomainScanner.xcodeproj \
            -scheme DomainScanner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DomainScanner.app Payload/
          zip -r DomainScanner.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DomainScanner-Unsigned-IPA
          path: DomainScanner.ipa
          retention-days: 14
